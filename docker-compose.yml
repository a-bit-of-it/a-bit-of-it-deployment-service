services:
  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GitHub__PackagesToken: ${GITHUB_PACKAGES_TOKEN}
      Ssh__Username: ${SSH_USERNAME}
      Ssh__Password: ${SSH_PASSWORD}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
